[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti7ocr"
version = "0.1.0"
description = "Next-generation Anti-OCR image generation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "anti7ocr contributors"}
]
dependencies = [
  "Pillow>=10.0.0",
  "click>=8.1.0",
  "PyYAML>=6.0.0",
  "numpy>=1.26.0",
  "pypinyin>=0.54.0",
]

[project.optional-dependencies]
eval = [
  "pytesseract>=0.3.10",
  "cnocr>=2.3.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
anti7ocr = "anti7ocr.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
